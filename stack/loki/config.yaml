auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h
  allow_structured_metadata: true
  discover_log_levels: true
  # Needed by Grafana's Logs Drilldown (volume bars per label, patterns tab).
  volume_enabled: true
  # Lets the app's "Stop" button delete a server's logs (POST /loki/api/v1/delete).
  # Queries hide deleted lines right away; the compactor removes them from disk.
  deletion_mode: filter-and-delete
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

pattern_ingester:
  enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  # Default is 24h; a stop in this app is meant to take effect now.
  delete_request_cancel_period: 10s
  compaction_interval: 5m

analytics:
  reporting_enabled: false
