<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>Log Analyzer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="toolbar">
    <h1>Log Analyzer</h1>

    <section class="group" aria-label="Docker stack">
      <span class="label">Grafana stack</span>
      <span id="stack-state" class="pill">checking…</span>
      <button id="stack-up">Start</button>
      <button id="stack-down" class="secondary">Stop</button>
      <button id="open-grafana" class="secondary">Open Grafana</button>
    </section>

    <section class="group" aria-label="Polling">
      <span class="label">Polling</span>
      <span id="poll-state" class="pill">stopped</span>
      <label class="inline">every <input id="poll-seconds" type="number" min="5" step="1" /> s</label>
      <button id="poll-toggle">Start</button>
      <button id="poll-now" class="secondary">Poll now</button>
    </section>
  </header>

  <main class="layout">
    <section class="panel servers">
      <div class="panel-head">
        <h2>Servers</h2>
        <button id="add-server">+ Add server</button>
      </div>
      <ul id="server-list" class="server-list"></ul>
      <p id="empty-servers" class="empty">No servers yet. Add one with its <code>user@ip</code> and the log files to pull.</p>
    </section>

    <section class="panel activity">
      <div class="panel-head">
        <h2>Activity</h2>
        <button id="open-logs" class="secondary">Open logs folder</button>
      </div>
      <ol id="activity" class="activity-log"></ol>
    </section>
  </main>

  <dialog id="server-dialog">
    <form id="server-form" method="dialog">
      <h2 id="server-dialog-title">Add server</h2>
      <input type="hidden" name="id" />

      <div class="grid">
        <label>Name <input name="name" required placeholder="web-01" /></label>
        <label>Target (user@ip) <input name="target" required placeholder="root@203.0.113.10" /></label>
        <label>SSH port <input name="port" type="number" min="1" max="65535" value="22" /></label>
        <label>Transfer mode
          <select name="mode">
            <option value="scp">scp – copy the file, keep only new lines</option>
            <option value="tail">ssh tail – send only new bytes (large files)</option>
          </select>
        </label>
      </div>

      <label>Private key (blank = ssh default / agent)
        <span class="row">
          <input name="identityFile" placeholder="C:\Users\you\.ssh\id_ed25519" />
          <button type="button" id="pick-key" class="secondary">Browse…</button>
        </span>
      </label>

      <label>Remote log files (one absolute path per line)
        <textarea name="paths" rows="5" placeholder="/var/log/syslog&#10;/var/log/nginx/access.log"></textarea>
      </label>

      <label class="inline"><input name="enabled" type="checkbox" checked /> Enabled</label>

      <div class="row actions">
        <button type="button" id="test-server" class="secondary">Test connection</button>
        <button type="button" id="browse-server" class="secondary">Select files from server…</button>
        <span class="spacer"></span>
        <button type="button" id="cancel-server" class="secondary">Cancel</button>
        <button type="submit" id="save-server">Save</button>
      </div>
      <pre id="server-feedback" class="feedback" hidden></pre>
    </form>
  </dialog>

  <dialog id="browse-dialog">
    <form id="browse-form" method="dialog">
      <h2>Select log files</h2>
      <div class="row">
        <input id="browse-root" value="/var/log" />
        <button type="button" id="browse-refresh" class="secondary">List</button>
      </div>
      <input id="browse-filter" placeholder="Filter…" />
      <ul id="browse-list" class="browse-list"></ul>
      <div class="row actions">
        <span id="browse-count" class="muted"></span>
        <span class="spacer"></span>
        <button type="button" id="browse-cancel" class="secondary">Cancel</button>
        <button type="submit" id="browse-apply">Add selected</button>
      </div>
    </form>
  </dialog>

  <script src="renderer.js"></script>
</body>
</html>
